name: WhatsApp Auto Sender
on:
  # Legacy sender: automatic WhatsApp runs retired in favor of Telegram on Render.
  workflow_dispatch:      # Allow manual trigger

jobs:
  run-script:
    if: ${{ vars.WHATSAPP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WhatsAppExcelMonitorElevenLabsV2/scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: WhatsAppExcelMonitorElevenLabsV2/scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create excel directory (if missing)
        run: mkdir -p excel

      - name: Run WhatsApp Auto Sender
        env:
          WHATSAPP_ENABLED: 'true'
          # Optional: If script is modified to use env vars, set them here
          ID_INSTANCE: ${{ secrets.ID_INSTANCE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ secrets.VOICE_ID }}
        run: node autoSender.js
